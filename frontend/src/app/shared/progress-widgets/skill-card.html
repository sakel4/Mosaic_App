<article class="skill-card">
  <div class="skill-heading">
    <span class="skill-dot" aria-hidden="true"></span>
    <h3>{{ skill().name }}</h3>
  </div>
  <app-progress-bar [value]="skill().progress" [label]="skill().name" />
  <p>Practice accuracy · {{ skill().change > 0 ? '+' : '' }}{{ skill().change }} percentage points after your latest answer</p>
</article>
